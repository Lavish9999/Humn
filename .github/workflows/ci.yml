name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  application:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-ci-placeholder
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_ANON_KEY: local-ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install --ignore-scripts
      - run: npm run lint
      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee application-typecheck.log
      - name: Test
        run: |
          set -o pipefail
          npm run test 2>&1 | tee application-test.log
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee application-build.log
      - run: npx expo export --platform ios --output-dir apps/mobile/dist/ios
        working-directory: apps/mobile
      - run: npx expo export --platform android --output-dir apps/mobile/dist/android
        working-directory: apps/mobile
      - run: npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
      - name: Upload application diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: application-diagnostics
          path: |
            application-typecheck.log
            application-test.log
            application-build.log
          if-no-files-found: warn
          retention-days: 7

  web-verification-pipeline:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-ci-placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install --ignore-scripts
      - run: npm run lint -w @human/web
      - run: npm run typecheck -w @human/web
      - run: npm run test -w @human/web
      - run: npm run build -w @human/web

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Start Supabase
        run: |
          set -o pipefail
          supabase start 2>&1 | tee database-start.log
      - name: Reset and migrate database
        run: |
          set -o pipefail
          supabase db reset 2>&1 | tee database-reset.log
      - name: Run database tests
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee database-test.log
      - name: Upload database diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-diagnostics
          path: |
            database-start.log
            database-reset.log
            database-test.log
          if-no-files-found: warn
          retention-days: 7
      - if: always()
        run: supabase stop --no-backup

  direct-upload-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Install dependencies
        run: npm install
      - name: Start and migrate local Supabase
        run: |
          set -o pipefail
          supabase start 2>&1 | tee direct-upload-supabase-start.log
          supabase db reset 2>&1 | tee direct-upload-supabase-reset.log
          supabase status -o env > supabase.env
          set -a
          source supabase.env
          set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_ENV=development" >> "$GITHUB_ENV"
          echo "TEST_BASE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
      - name: Start Humn web app
        run: |
          npm run dev -w @human/web -- --hostname 127.0.0.1 > humn-web.log 2>&1 &
          echo $! > humn-web.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/share > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat humn-web.log
          exit 1
      - name: Test direct uploads and authorization
        run: node scripts/test-direct-work-upload.mjs 2>&1 | tee direct-upload-test.log
      - name: Upload direct-upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: direct-upload-diagnostics
          path: |
            direct-upload-supabase-start.log
            direct-upload-supabase-reset.log
            direct-upload-test.log
            humn-web.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop local services
        if: always()
        run: |
          if [ -f humn-web.pid ]; then kill "$(cat humn-web.pid)" || true; fi
          supabase stop --no-backup
